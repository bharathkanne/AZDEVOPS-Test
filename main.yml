trigger: none

resources:
  - repo: self

extends:
  template: templates/base-pipeline.yml
  parameters:
    vmImage: 'ubuntu-latest'
    acrServiceConnection: 'azcrrdj'
    acrLoginServer: 'azuredevopsrdj.azurecr.io'
    imageRepository: 'fleet-app'
    dockerfileName: 'test.Dockerfile'
    artifactFeed: 'fleet-appv1/fleet-app-feed1'
    universalPackageName: 'fleet-app-bundle'
    devVariableGroup: 'fleet-app-dev-vg'
    prodVariableGroup: 'fleet-app-prod-vg'
    containerPort: '3000'
    devHostPort: '3001'
    prodHostPort: '3000'
    prodUseVirtualMachine: true