trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  - repo: self

pool:
  name: default

variables:
  # --- ACR Settings ---
  acrServiceConnection: 'azcrrdj'
  acrLoginServer: 'azuredevopsrdj.azurecr.io'
  imageRepository: 'fleet-app'
  tag: '$(Build.BuildId)'
  # --- Azure Artifacts Feed Settings ---
  artifactFeed: 'fleet-appv1/fleet-app-feed1'      # Format: '<ProjectName>/<FeedName>' (or '<FeedName>' if org-scoped)
  universalPackageName: 'fleet-app-bundle'

stages:
  # ============================================================================
  # STAGE 1: CI (Matrix Tests, Push to ACR, Pipeline Artifact & Azure Artifacts)
  # ============================================================================
  - stage: CI_Stage
    displayName: 'Stage 1: CI Build, ACR Push & Artifacts'
    dependsOn: []
    condition: succeeded()
    trigger: automatic
    isSkippable: false
    lockBehavior: runLatest
    variables:
      dockerfileName: 'test.Dockerfile'
    pool:
      name: default

    jobs:
      # ------------------------------------------------------------------------
      # JOB 1: Parallel Matrix Tests in Isolated Container with Redis Sidecar
      # ------------------------------------------------------------------------
      - job: MatrixTestJob
        displayName: 'Test Matrix in Isolated Container'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 20
        workspace:
          clean: outputs
        variables:
          CI: 'true'
        strategy:
          maxParallel: 2
          matrix:
            Node20_Env:
              NODE_TARGET: '20'
              TEST_SUITE: 'unit'
            Node22_Env:
              NODE_TARGET: '22'
              TEST_SUITE: 'routing'
        container: node:22-bookworm-slim
        services:
          redis: redis:7-alpine

        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - bash: |
              set -e
              echo "Running $(TEST_SUITE) tests on Node target $(NODE_TARGET)"
              node -v
              echo "##vso[task.setvariable variable=buildReady;isOutput=true]true"
            name: EnvCheckStep
            displayName: 'Bash: Check Runtime & Export Output Variable'
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: false
            env:
              REDIS_HOST: 'redis'
              TARGET_VERSION: '$(NODE_TARGET)'

          - bash: |
              node -e '
                const pkg = require("./package.json");
                console.log(`Validated package: ${pkg.name} (Type: ${pkg.type})`);
              '
            name: MetadataStep
            displayName: 'Node: Validate package.json'
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 3
            continueOnError: true
            env:
              APP_MODE: 'ci'

          - script: |
              echo "Executing host-level check outside job container"
              docker info --format '{{.ServerVersion}}'
            name: HostCheckStep
            displayName: 'Script (Host Target): Verify Host Docker Engine'
            target: host
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: false
            env:
              HOST_OS: '$(Agent.OS)'

      # ------------------------------------------------------------------------
      # JOB 2: Build & Push ACR Image + Publish Pipeline & Azure Artifacts
      # ------------------------------------------------------------------------
      - job: BuildAndPublishArtifactsJob
        displayName: 'Push ACR Image & Publish Artifacts'
        dependsOn: MatrixTestJob
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 30
        workspace:
          clean: all
        variables:
          DOCKER_BUILDKIT: '1'

        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          # 1. Build Docker image & push to Azure Container Registry
          - task: Docker@2
            name: BuildAndPushTask
            displayName: 'Task: Build & Push Image to ACR'
            condition: succeeded()
            enabled: true
            target: host
            timeoutInMinutes: 20
            retryCountOnTaskFailure: 1
            env:
              DOCKER_BUILDKIT: '1'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: '$(imageRepository)'
              Dockerfile: '$(dockerfileName)'
              tags: |
                $(tag)
                latest

          # 2. Prepare release bundle (metadata + Dockerfile + package.json) in staging folder
          - bash: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)/release-bundle
              cp package.json test.Dockerfile $(Build.ArtifactStagingDirectory)/release-bundle/
              cat <<EOF > $(Build.ArtifactStagingDirectory)/release-bundle/image-manifest.json
              {
                "image": "$(acrLoginServer)/$(imageRepository):$(tag)",
                "buildId": "$(Build.BuildId)",
                "commit": "$(Build.SourceVersion)",
                "branch": "$(Build.SourceBranchName)"
              }
              EOF
              ls -la $(Build.ArtifactStagingDirectory)/release-bundle
            name: PrepareBundleStep
            displayName: 'Bash: Prepare Release Bundle for Artifacts'

          # 3. PIPELINE ARTIFACT: Stores files inside this pipeline run for downstream stages
          - task: PublishPipelineArtifact@1
            name: PublishPipelineArtifactTask
            displayName: 'Pipeline Artifact: Publish Release Bundle'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/release-bundle'
              artifact: 'fleet-app-pipeline-artifact'
              publishLocation: 'pipeline'

          # 4. AZURE ARTIFACT: Publishes versioned package to Azure Artifacts Feed
          - task: UniversalPackages@0
            name: PublishAzureArtifactTask
            displayName: 'Azure Artifacts: Publish Universal Package'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              command: 'publish'
              publishDirectory: '$(Build.ArtifactStagingDirectory)/release-bundle'
              feedsToUsePublish: 'internal'
              vstsFeedPublish: '$(artifactFeed)'
              vstsFeedPackagePublish: '$(universalPackageName)'
              versionOption: 'custom'
              versionPublish: '1.0.$(Build.BuildId)'
              packagePublishDescription: 'Release bundle and image manifest for fleet-app build $(Build.BuildId)'

  # ============================================================================
  # STAGE 2: ARTIFACT & IMAGE VERIFICATION (Consumes Pipeline Artifact & ACR)
  # ============================================================================
  - stage: Artifact_Verification_Stage
    displayName: 'Stage 2: Verify Pipeline Artifact & ACR Image'
    dependsOn: CI_Stage
    condition: succeeded()
    trigger: automatic
    isSkippable: true
    lockBehavior: sequential
    variables:
      FULL_IMAGE: '$(acrLoginServer)/$(imageRepository):$(tag)'
    pool:
      name: default

    jobs:
      - job: VerifyArtifactsJob
        displayName: 'Download Pipeline Artifact & Inspect ACR Image'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 10
        workspace:
          clean: outputs

        steps:
          - checkout: none

          # Downloads the Pipeline Artifact created in Stage 1
          - task: DownloadPipelineArtifact@2
            name: DownloadPipelineArtifactTask
            displayName: 'Pipeline Artifact: Download Release Bundle'
            inputs:
              buildType: 'current'
              artifactName: 'fleet-app-pipeline-artifact'
              targetPath: '$(Pipeline.Workspace)/downloaded-bundle'

          - bash: |
              echo "Contents of downloaded Pipeline Artifact:"
              ls -la $(Pipeline.Workspace)/downloaded-bundle
              cat $(Pipeline.Workspace)/downloaded-bundle/image-manifest.json
            name: VerifyBundleStep
            displayName: 'Bash: Verify Downloaded Manifest'

          - task: Docker@2
            displayName: 'Task: Login to ACR'
            inputs:
              command: 'login'
              containerRegistry: '$(acrServiceConnection)'

          - bash: |
              docker pull $(FULL_IMAGE)
              docker image inspect $(FULL_IMAGE) --format='Size={{.Size}} Created={{.Created}}'
            name: InspectACRImageStep
            displayName: 'Bash: Pull & Inspect ACR Image Metadata'
            continueOnError: true

          - task: Docker@2
            displayName: 'Task: Logout from ACR'
            condition: always()
            inputs:
              command: 'logout'
              containerRegistry: '$(acrServiceConnection)'