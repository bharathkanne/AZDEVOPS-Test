parameters:
  - name: vmImage
    type: string
    default: 'ubuntu-latest'
  - name: acrServiceConnection
    type: string
  - name: imageRepository
    type: string
  - name: fullImage
    type: string
  - name: tag
    type: string
  - name: dockerfileName
    type: string
    default: 'test.Dockerfile'
  - name: artifactFeed
    type: string
  - name: universalPackageName
    type: string
  - name: runSecurityScan
    type: boolean
    default: true
  - name: securityBreakBuild
    type: boolean
    default: true

stages:
  # ============================================================================
  # STAGE 1: CI (Secret Scan, SAST, SCA, Matrix Tests, ACR Push & Artifacts)
  # ============================================================================
  - stage: CI_Stage
    displayName: 'Stage 1: CI Security Scan, Build & Artifacts'
    dependsOn: []
    condition: succeeded()
    trigger: automatic
    isSkippable: false
    lockBehavior: runLatest
    pool:
      vmImage: ${{ parameters.vmImage }}
    variables:
      - name: dockerfileName
        value: ${{ parameters.dockerfileName }}
    jobs:
      # ------------------------------------------------------------------------
      # JOB 0: SECRET SCANNING GATE (Gitleaks + TruffleHog)
      # ------------------------------------------------------------------------
      - job: SecretScanJob
        displayName: 'Security: Gitleaks & TruffleHog Secret Scan'
        timeoutInMinutes: 10
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true
            displayName: 'Checkout Full Git History'

          - bash: |
              set -e
              echo "Installing Gitleaks..."
              GITLEAKS_VERSION="8.30.1"
              curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
              tar -xzf gitleaks.tar.gz gitleaks
              sudo mv gitleaks /usr/local/bin/
              rm -f gitleaks.tar.gz

              mkdir -p $(Build.ArtifactStagingDirectory)/security-reports
              echo "Running Gitleaks scan across full commit history..."
              gitleaks detect \
                --source . \
                --verbose \
                --redact \
                --report-format sarif \
                --report-path $(Build.ArtifactStagingDirectory)/security-reports/gitleaks.sarif
            name: GitleaksScanStep
            displayName: 'Gitleaks: Scan Repo & History (Regex + Entropy)'

          - bash: |
              set -e
              echo "Running TruffleHog live-verification scan..."
              docker run --rm \
                -v "$(Build.SourcesDirectory):/repo" \
                ghcr.io/trufflesecurity/trufflehog:latest \
                git file:///repo \
                --only-verified \
                --fail \
                --no-update
            name: TruffleHogScanStep
            displayName: 'TruffleHog: Live-Verify Active Credentials'

          - task: PublishPipelineArtifact@1
            name: PublishSecurityReportTask
            displayName: 'Publish Gitleaks SARIF Report'
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/security-reports'
              artifact: 'security-scan-reports'
              publishLocation: 'pipeline'

      # ------------------------------------------------------------------------
      # JOB 1A: SAST SOURCE CODE GATE (Semgrep AST & Taint Analysis)
      # ------------------------------------------------------------------------
      - job: SemgrepSASTJob
        displayName: 'SAST: Semgrep Source Code Analysis'
        dependsOn: SecretScanJob
        condition: succeeded()
        timeoutInMinutes: 15
        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - bash: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)/sast-reports
              echo "Running Semgrep AST & taint analysis..."
              docker run --rm \
                -v "$(Build.SourcesDirectory):/src" \
                -v "$(Build.ArtifactStagingDirectory)/sast-reports:/reports" \
                semgrep/semgrep:latest \
                semgrep scan \
                  --config auto \
                  --config p/typescript \
                  --config p/nodejs \
                  --config p/owasp-top-ten \
                  --severity ERROR \
                  --error \
                  --sarif-output=/reports/semgrep.sarif \
                  /src
            name: RunSemgrepStep
            displayName: 'Semgrep: Scan Codebase (TypeScript, Node & OWASP)'

          - task: PublishPipelineArtifact@1
            name: PublishSemgrepReportTask
            displayName: 'Publish Semgrep SARIF Report'
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/sast-reports'
              artifact: 'semgrep-sast-report'
              publishLocation: 'pipeline'

      # ------------------------------------------------------------------------
      # JOB 1B: SCA DEPENDENCY & LICENSE GATE (Trivy FS + Google OSV-Scanner)
      # ------------------------------------------------------------------------
      - job: SCAScanJob
        displayName: 'SCA: Trivy FS & OSV-Scanner Dependency Audit'
        dependsOn: SecretScanJob
        condition: succeeded()
        timeoutInMinutes: 15
        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - task: NodeTool@0
            name: UseNode22Step
            displayName: 'Install Node.js 22.x'
            inputs:
              versionSpec: '22.x'

          - bash: |
              set -e
              npm ci --legacy-peer-deps
              mkdir -p $(Build.ArtifactStagingDirectory)/sca-reports
            name: InstallDepsStep
            displayName: 'Install Dependencies for License & Lockfile Resolution'

          - bash: |
              set -e
              echo "Generating Trivy FS SARIF report (CVEs + Licenses)..."
              docker run --rm \
                -v "$(Build.SourcesDirectory):/src" \
                -v "$(Build.ArtifactStagingDirectory)/sca-reports:/reports" \
                -w /src \
                aquasec/trivy:latest fs . \
                  --scanners vuln,license \
                  --severity CRITICAL,HIGH \
                  --ignore-unfixed \
                  --skip-files "**/bun.lock" \
                  --format sarif \
                  --output /reports/trivy-sca.sarif

              echo "Enforcing Trivy SCA Quality Gate..."
              docker run --rm \
                -v "$(Build.SourcesDirectory):/src" \
                -w /src \
                aquasec/trivy:latest fs . \
                  --scanners vuln \
                  --severity CRITICAL,HIGH \
                  --ignore-unfixed \
                  --skip-files "**/bun.lock" \
                  --exit-code 1
            name: TrivySCAStep
            displayName: 'Trivy FS: Scan Dependencies & Enforce Gate'


          - task: PublishPipelineArtifact@1
            name: PublishSCAReportTask
            displayName: 'Publish Trivy & OSV-Scanner SARIF Reports'
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/sca-reports'
              artifact: 'sca-scan-reports'
              publishLocation: 'pipeline'

      # ------------------------------------------------------------------------
      # JOB 2: MATRIX TESTS (Runs Only After SecretScan, Semgrep & SCA Pass)
      # ------------------------------------------------------------------------
      - job: MatrixTestJob
        displayName: 'Test Matrix in Isolated Container'
        dependsOn:
          - SemgrepSASTJob
          - SCAScanJob
        condition: succeeded()
        timeoutInMinutes: 20
        workspace:
          clean: outputs
        variables:
          - name: CI
            value: 'true'
        strategy:
          maxParallel: 2
          matrix:
            Node20_Env:
              NODE_TARGET: '20'
              TEST_SUITE: 'unit'
            Node22_Env:
              NODE_TARGET: '22'
              TEST_SUITE: 'routing'
        container: node:22-bookworm-slim
        services:
          redis: redis:7-alpine
        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - bash: |
              set -e
              echo "Running $(TEST_SUITE) tests on Node target $(NODE_TARGET)"
              node -v
              echo "##vso[task.setvariable variable=buildReady;isOutput=true]true"
            name: EnvCheckStep
            displayName: 'Bash: Check Runtime & Export Output Variable'
            timeoutInMinutes: 5
            env:
              REDIS_HOST: 'redis'
              TARGET_VERSION: '$(NODE_TARGET)'

          - bash: |
              node -e '
                const pkg = require("./package.json");
                console.log(`Validated package: ${pkg.name} (Type: ${pkg.type})`);
              '
            name: MetadataStep
            displayName: 'Node: Validate package.json'
            timeoutInMinutes: 3
            continueOnError: true

          - script: |
              echo "Executing host-level check outside job container"
              docker info --format '{{.ServerVersion}}'
            name: HostCheckStep
            displayName: 'Script (Host Target): Verify Host Docker Engine'
            target: host
            timeoutInMinutes: 5

      # ------------------------------------------------------------------------
      # JOB 3: BUILD, ACR PUSH, MSDO SCAN & ARTIFACTS
      # ------------------------------------------------------------------------
      - job: BuildAndPublishArtifactsJob
        displayName: 'Push ACR Image & Publish Artifacts'
        dependsOn: MatrixTestJob
        condition: succeeded()
        timeoutInMinutes: 30
        workspace:
          clean: all
        variables:
          - name: DOCKER_BUILDKIT
            value: '1'
        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - task: Docker@2
            name: BuildAndPushTask
            displayName: 'Task: Build & Push Image to ACR'
            target: host
            timeoutInMinutes: 20
            retryCountOnTaskFailure: 1
            inputs:
              command: 'buildAndPush'
              containerRegistry: ${{ parameters.acrServiceConnection }}
              repository: ${{ parameters.imageRepository }}
              Dockerfile: '$(dockerfileName)'
              tags: |
                ${{ parameters.tag }}
                latest

          - ${{ if eq(parameters.runSecurityScan, true) }}:
            - task: MicrosoftSecurityDevOps@1
              name: RunMSDOTask
              displayName: 'Security: MSDO Scan (Trivy, Checkov, ESLint)'
              timeoutInMinutes: 15
              inputs:
                categories: 'code,iac,containers'
                tools: 'trivy,checkov,eslint'
                break: ${{ parameters.securityBreakBuild }}

          - bash: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)/release-bundle
              cp package.json $(dockerfileName) $(Build.ArtifactStagingDirectory)/release-bundle/
              cat <<EOF > $(Build.ArtifactStagingDirectory)/release-bundle/image-manifest.json
              {
                "image": "${{ parameters.fullImage }}",
                "buildId": "$(Build.BuildId)",
                "commit": "$(Build.SourceVersion)",
                "branch": "$(Build.SourceBranchName)"
              }
              EOF
            name: PrepareBundleStep
            displayName: 'Bash: Prepare Release Bundle for Artifacts'

          - task: PublishPipelineArtifact@1
            name: PublishPipelineArtifactTask
            displayName: 'Pipeline Artifact: Publish Release Bundle'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/release-bundle'
              artifact: 'fleet-app-pipeline-artifact'
              publishLocation: 'pipeline'

          - task: UniversalPackages@0
            name: PublishAzureArtifactTask
            displayName: 'Azure Artifacts: Publish Universal Package'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              command: 'publish'
              publishDirectory: '$(Build.ArtifactStagingDirectory)/release-bundle'
              feedsToUsePublish: 'internal'
              vstsFeedPublish: ${{ parameters.artifactFeed }}
              vstsFeedPackagePublish: ${{ parameters.universalPackageName }}
              versionOption: 'custom'
              versionPublish: '1.0.$(Build.BuildId)'
              packagePublishDescription: 'Release bundle and image manifest for ${{ parameters.imageRepository }} build $(Build.BuildId)'

  # ============================================================================
  # STAGE 2: ARTIFACT & IMAGE VERIFICATION
  # ============================================================================
  - stage: Artifact_Verification_Stage
    displayName: 'Stage 2: Verify Pipeline Artifact & ACR Image'
    dependsOn: CI_Stage
    condition: succeeded()
    isSkippable: true
    lockBehavior: sequential
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: VerifyArtifactsJob
        displayName: 'Download Pipeline Artifact & Inspect ACR Image'
        timeoutInMinutes: 10
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            name: DownloadPipelineArtifactTask
            displayName: 'Pipeline Artifact: Download Release Bundle'
            inputs:
              buildType: 'current'
              artifactName: 'fleet-app-pipeline-artifact'
              targetPath: '$(Pipeline.Workspace)/downloaded-bundle'

          - ${{ if eq(parameters.runSecurityScan, true) }}:
            - task: DownloadPipelineArtifact@2
              name: DownloadSecurityLogsTask
              displayName: 'Security Artifact: Download SARIF Logs'
              inputs:
                buildType: 'current'
                artifactName: 'CodeAnalysisLogs'
                targetPath: '$(Pipeline.Workspace)/security-logs'

          - bash: |
              ls -la $(Pipeline.Workspace)/downloaded-bundle
              cat $(Pipeline.Workspace)/downloaded-bundle/image-manifest.json
            name: VerifyBundleStep
            displayName: 'Bash: Verify Downloaded Manifest'
