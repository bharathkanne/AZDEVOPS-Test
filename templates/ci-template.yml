stages:
  - stage: CI
    displayName: 'Continuous Integration & Security Gates'
    jobs:
      # 1. Secret Scanning (Gitleaks)
      - job: SecretScanJob
        displayName: 'Secret Scan (Gitleaks)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)
              docker run --rm \
                -v "$(Build.SourcesDirectory):/repo" \
                -v "$(Build.ArtifactStagingDirectory):/out" \
                ghcr.io/gitleaks/gitleaks:v8.30.1 \
                git /repo --verbose --redact \
                --report-format sarif \
                --report-path /out/gitleaks.sarif
            displayName: 'Run Gitleaks Secret Scan'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/gitleaks.sarif'
              ArtifactName: 'CodeAnalysisLogs'
            displayName: 'Publish Gitleaks SARIF'

      # 2. Static Application Security Testing — SAST (Semgrep)
      - job: SemgrepSASTJob
        displayName: 'SAST Scan (Semgrep)'
        dependsOn: SecretScanJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)
              docker run --rm \
                -v "$(Build.SourcesDirectory):/src" \
                -v "$(Build.ArtifactStagingDirectory):/out" \
                semgrep/semgrep:latest \
                semgrep scan --config auto --error \
                --sarif --sarif-output=/out/semgrep.sarif /src
            displayName: 'Run Semgrep SAST Scan'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/semgrep.sarif'
              ArtifactName: 'CodeAnalysisLogs'
            displayName: 'Publish Semgrep SARIF'

      # 3. Software Composition Analysis — SCA (Trivy FS + Google OSV-Scanner)
      - job: SCAScanJob
        displayName: 'SCA Scan (Trivy FS & OSV-Scanner)'
        dependsOn: SecretScanJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Use Node.js 22.x'

          - script: npm ci --legacy-peer-deps
            displayName: 'Install Dependencies for License & Lockfile Resolution'

          # --- Trivy FS (SARIF Report + Quality Gate) ---
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)
              docker run --rm \
                -v "$(Build.SourcesDirectory):/src" \
                -v "$(Build.ArtifactStagingDirectory):/out" \
                -w /src \
                aquasec/trivy:0.74.0 fs . \
                  --scanners vuln,license \
                  --severity CRITICAL,HIGH \
                  --ignore-unfixed \
                  --format sarif \
                  --output /out/trivy-sca.sarif
            displayName: 'SCA Scan (Trivy FS)'

          - script: |
              docker run --rm \
                -v "$(Build.SourcesDirectory):/src" \
                -w /src \
                aquasec/trivy:0.74.0 fs . \
                  --scanners vuln \
                  --severity CRITICAL,HIGH \
                  --ignore-unfixed \
                  --exit-code 1
            displayName: 'SCA Quality Gate (Fail on High/Critical)'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy-sca.sarif'
              ArtifactName: 'CodeAnalysisLogs'
            displayName: 'Publish Trivy SCA SARIF'

          # --- Google OSV-Scanner (Lockfile + SPDX License Allowlist) ---
          - script: |
              curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /tmp/osv-scanner
              chmod +x /tmp/osv-scanner
              /tmp/osv-scanner scan source \
                --lockfile=package-lock.json \
                --licenses="MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC" \
                --format sarif > $(Build.ArtifactStagingDirectory)/osv-sca.sarif
            displayName: 'SCA Scan (Google OSV-Scanner)'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/osv-sca.sarif'
              ArtifactName: 'CodeAnalysisLogs'
            displayName: 'Publish OSV-Scanner SARIF'

      # 4. Node.js Matrix Build, Lint, Typecheck & Test
      - job: MatrixTestJob
        displayName: 'Test & Validate'
        dependsOn:
          - SemgrepSASTJob
          - SCAScanJob
        strategy:
          matrix:
            Node20:
              nodeVersion: '20.x'
            Node22:
              nodeVersion: '22.x'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: 'Install Node.js $(nodeVersion)'

          - script: npm ci --legacy-peer-deps
            displayName: 'Install Dependencies'

          - script: npx tsc --noEmit
            displayName: 'TypeScript Type Check'

          - script: npm run lint
            displayName: 'Run ESLint'

          - script: npm run test
            displayName: 'Run Unit Tests'

      # 5. Production Build & Pipeline Artifact Publish
      - job: BuildAndPublishArtifactsJob
        displayName: 'Build Nitro Bundle & Publish Artifacts'
        dependsOn: MatrixTestJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Install Node.js 22.x'

          - script: npm ci --legacy-peer-deps
            displayName: 'Install Dependencies'

          - script: |
              export NITRO_PRESET=node-server
              npm run build
            displayName: 'Build Nitro Server'

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/bundle
              cp -r .output package.json package-lock.json $(Build.ArtifactStagingDirectory)/bundle/
            displayName: 'Stage Production Bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/bundle'
              artifact: 'fleet-app-pipeline-artifact'
            displayName: 'Publish Pipeline Artifact'
