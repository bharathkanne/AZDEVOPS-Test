parameters:
  - name: stageName
    type: string
    default: 'Staging_DAST_Stage'
  - name: displayName
    type: string
    default: 'Stage 4: Staging Full Active DAST Scan'
  - name: dependsOn
    type: object
  - name: condition
    type: string
    default: "and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Schedule')))"
  - name: vmImage
    type: string
    default: 'ubuntu-latest'
  - name: acrServiceConnection
    type: string
  - name: fullImage
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    isSkippable: true
    lockBehavior: sequential
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: StagingActiveDASTJob
        displayName: 'Active DAST: OWASP ZAP Full Fuzzing Scan'
        timeoutInMinutes: 45
        steps:
          - checkout: none

          - task: Docker@2
            name: LoginACRStep
            displayName: 'Login to ACR'
            inputs:
              command: 'login'
              containerRegistry: ${{ parameters.acrServiceConnection }}

          - bash: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)/staging-dast
              chmod 777 $(Build.ArtifactStagingDirectory)/staging-dast

              cleanup() {
                echo "Cleaning up ephemeral DAST containers and network..."
                docker rm -f dast-app dast-redis >/dev/null 2>&1 || true
                docker network rm dast-net >/dev/null 2>&1 || true
              }
              trap cleanup EXIT

              echo "1. Starting isolated network, Redis, and target container (${{ parameters.fullImage }})..."
              docker network create dast-net
              docker run -d --name dast-redis --network dast-net --network-alias redis redis:7-alpine
              docker run -d --name dast-app --network dast-net --network-alias fleet-app \
                -e NODE_ENV=production \
                -e PORT=3000 \
                -e HOST=0.0.0.0 \
                -e REDIS_HOST=redis \
                "${{ parameters.fullImage }}"

              echo "2. Waiting for fleet-app to respond on port 3000..."
              for i in $(seq 1 20); do
                if docker run --rm --network dast-net curlimages/curl:latest -sf http://fleet-app:3000/ >/dev/null 2>&1; then
                  echo "Target container is reachable."
                  break
                fi
                if [ "$i" -eq 20 ]; then
                  echo "##vso[task.logissue type=error]Timed out waiting for fleet-app container to start."
                  docker logs dast-app
                  exit 1
                fi
                sleep 2
              done

              echo "3. Running OWASP ZAP Full Active Scan..."
              docker run --rm \
                --network dast-net \
                -v "$(Build.ArtifactStagingDirectory)/staging-dast:/zap/wrk:rw" \
                ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
                  -t http://fleet-app:3000 \
                  -m 10 \
                  -I \
                  -r zap-full-report.html \
                  -J zap-full-report.json
            name: StagingZAPFullScanStep
            displayName: 'OWASP ZAP: Full Active Scan Against Container'

          - task: PublishPipelineArtifact@1
            name: PublishStagingDASTTask
            displayName: 'Publish Staging Active DAST Report'
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/staging-dast'
              artifact: 'staging-dast-reports'
              publishLocation: 'pipeline'

          - task: Docker@2
            name: LogoutACRStep
            displayName: 'Logout from ACR'
            condition: always()
            inputs:
              command: 'logout'
              containerRegistry: ${{ parameters.acrServiceConnection }}
