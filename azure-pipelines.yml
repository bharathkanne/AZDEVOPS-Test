trigger: none

 

resources:
  - repo: self

pool:
  name: default

variables:
  imageName: 'fleet-app'
  tag: '$(Build.BuildId)'
  containerName: 'fleet-app-live'
  hostPort: '3000'
  containerPort: '3000'

stages:
  # ============================================================================
  # STAGE 1: CI (Matrix Validation, Containerized Jobs, Sidecars & Docker Build)
  # ============================================================================
  - stage: CI_Stage
    displayName: 'Stage 1: CI Validation & Docker Build'
    dependsOn: []
    condition: succeeded()
    trigger: automatic
    isSkippable: false
    lockBehavior: runLatest
    variables:
      dockerfileName: 'test.Dockerfile'
    pool:
      name: default

    jobs:
      # ------------------------------------------------------------------------
      # JOB 1: Parallel Matrix Tests in Isolated Container with Redis Sidecar
      # ------------------------------------------------------------------------
      - job: MatrixTestJob
        displayName: 'Test Matrix in Isolated Container'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 20
        workspace:
          clean: outputs
        variables:
          CI: 'true'
        strategy:
          maxParallel: 2
          matrix:
            Node20_Env:
              NODE_TARGET: '20'
              TEST_SUITE: 'unit'
            Node22_Env:
              NODE_TARGET: '22'
              TEST_SUITE: 'routing'
        # Debian-slim includes glibc + bash (required by Azure Pipelines container jobs)
        container: node:22-bookworm-slim
        services:
          redis: redis:7-alpine

        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - bash: |
              set -e
              echo "Running $(TEST_SUITE) tests on Node target $(NODE_TARGET)"
              node -v
              echo "##vso[task.setvariable variable=buildReady;isOutput=true]true"
            name: EnvCheckStep
            displayName: 'Bash: Check Runtime & Export Output Variable'
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: false
            env:
              REDIS_HOST: 'redis'
              TARGET_VERSION: '$(NODE_TARGET)'

          - pwsh: |
              $pkg = Get-Content package.json | ConvertFrom-Json
              Write-Host "Validated package: $($pkg.name) (Type: $($pkg.type))"
            name: MetadataStep
            displayName: 'PowerShell: Validate package.json'
            condition: succeeded()
            enabled: true
            target : host
            timeoutInMinutes: 3
            continueOnError: true
            env:
              APP_MODE: 'ci'

          - script: |
              echo "Executing host-level check outside job container"
              docker info --format '{{.ServerVersion}}'
            name: HostCheckStep
            displayName: 'Script (Host Target): Verify Host Docker Engine'
            target: host
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: false
            env:
              HOST_OS: '$(Agent.OS)'

      # ------------------------------------------------------------------------
      # JOB 2: Build Production Docker Image (Waits for MatrixTestJob)
      # ------------------------------------------------------------------------
      - job: DockerBuildJob
        displayName: 'Build Docker Image (Runs Lint, Test & Build)'
        dependsOn: MatrixTestJob
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 30
        workspace:
          clean: all
        variables:
          DOCKER_BUILDKIT: '1'

        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - task: Docker@2
            name: BuildImageTask
            displayName: 'Task: Build Docker Image'
            condition: succeeded()
            enabled: true
            target: host
            timeoutInMinutes: 20
            retryCountOnTaskFailure: 1
            env:
              DOCKER_BUILDKIT: '1'
            inputs:
              command: 'build'
              repository: '$(imageName)'
              Dockerfile: '$(dockerfileName)'
              tags: |
                $(tag)
                latest

  # ============================================================================
  # STAGE 2: OPTIONAL IMAGE AUDIT (Manual Trigger & Skippable Gate)
  # ============================================================================
  - stage: Security_Audit_Stage
    displayName: 'Stage 2: Optional Image Audit'
    dependsOn: CI_Stage
    condition: succeeded()
    trigger: automatic
    isSkippable: true
    lockBehavior: sequential
    variables:
      auditLevel: 'HIGH'
    pool:
      name: default

    jobs:
      - job: ImageInspectJob
        displayName: 'Inspect Built Docker Image'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 10
        workspace:
          clean: outputs
        variables:
          TARGET_IMAGE: '$(imageName):$(tag)'

        steps:
          - checkout: none

          - bash: |
              docker image inspect $(TARGET_IMAGE) --format='Size={{.Size}} Created={{.Created}}'
            name: InspectStep
            displayName: 'Bash: Inspect Image Metadata'
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: true
            env:
              AUDIT_LEVEL: '$(auditLevel)'

  # ============================================================================
  # STAGE 3: CD (Deploy & Verify Live Container on Self-Hosted PC)
  # ============================================================================
  - stage: CD_Stage
    displayName: 'Stage 3: Deploy Container to Self-Hosted PC'
    dependsOn:
      - CI_Stage
      - Security_Audit_Stage
    # Deploys only on main pushes (not PRs) if CI passed and Audit succeeded or was skipped
    condition: and(succeeded('CI_Stage'), in(dependencies.Security_Audit_Stage.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    trigger: automatic
    isSkippable: false
    lockBehavior: sequential
    variables:
      deployTarget: 'local-docker'
    pool:
      name: default

    jobs:
      - deployment: DeployToPC
        displayName: 'Run Container on PC'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 15
        workspace:
          clean: outputs
        variables:
          APP_ENV: 'production'
        environment: 'SelfHosted-PC'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - bash: |
                    echo "Stopping and removing existing container (if any)..."
                    docker rm -f $(containerName) 2>/dev/null || true

                    echo "Starting new container $(imageName):$(tag) on port $(hostPort)..."
                    docker run -d \
                      --name $(containerName) \
                      --restart unless-stopped \
                      -p $(hostPort):$(containerPort) \
                      $(imageName):$(tag)

                    echo "Waiting for server startup..."
                    sleep 5

                    echo "Verifying container status and HTTP response..."
                    docker ps --filter "name=$(containerName)"
                    docker logs $(containerName)
                    curl -f -I http://localhost:$(hostPort)
                  name: DeployContainerStep
                  displayName: 'Bash: Deploy & Verify Live Container'
                  condition: succeeded()
                  enabled: true
                  timeoutInMinutes: 10
                  continueOnError: false
                  env:
                    NODE_ENV: '$(APP_ENV)'