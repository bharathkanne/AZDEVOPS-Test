trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  - repo: self

pool:
  name: default

variables:
  # --- 1. UPDATE THESE TWO VALUES TO MATCH YOUR ACR ---
  acrServiceConnection: 'azrrdj.io'   # Exact name of your Service Connection in Azure DevOps
  acrLoginServer: 'azuredevopsrdj.azurecr.io'        # Exact Login server from Azure Portal -> ACR -> Overview
  # --- 2. IMAGE & CONTAINER SETTINGS ---
  imageRepository: 'fleet-app'
  tag: '$(Build.BuildId)'
  containerName: 'fleet-app-live'
  hostPort: '3000'
  containerPort: '3000'

stages:
  # ============================================================================
  # STAGE 1: CI (Matrix Validation + Build & Push to Azure Container Registry)
  # ============================================================================
  - stage: CI_Stage
    displayName: 'Stage 1: CI Validation & Push to ACR'
    dependsOn: []
    condition: succeeded()
    trigger: automatic
    isSkippable: false
    lockBehavior: runLatest
    variables:
      dockerfileName: 'test.Dockerfile'
    pool:
      name: default

    jobs:
      # ------------------------------------------------------------------------
      # JOB 1: Parallel Matrix Tests in Isolated Container with Redis Sidecar
      # ------------------------------------------------------------------------
      - job: MatrixTestJob
        displayName: 'Test Matrix in Isolated Container'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 20
        workspace:
          clean: outputs
        variables:
          CI: 'true'
        strategy:
          maxParallel: 2
          matrix:
            Node20_Env:
              NODE_TARGET: '20'
              TEST_SUITE: 'unit'
            Node22_Env:
              NODE_TARGET: '22'
              TEST_SUITE: 'routing'
        container: node:22-bookworm-slim
        services:
          redis: redis:7-alpine

        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          - bash: |
              set -e
              echo "Running $(TEST_SUITE) tests on Node target $(NODE_TARGET)"
              node -v
              echo "##vso[task.setvariable variable=buildReady;isOutput=true]true"
            name: EnvCheckStep
            displayName: 'Bash: Check Runtime & Export Output Variable'
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: false
            env:
              REDIS_HOST: 'redis'
              TARGET_VERSION: '$(NODE_TARGET)'

          - bash: |
              node -e '
                const pkg = require("./package.json");
                console.log(`Validated package: ${pkg.name} (Type: ${pkg.type})`);
              '
            name: MetadataStep
            displayName: 'Node: Validate package.json'
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 3
            continueOnError: true
            env:
              APP_MODE: 'ci'

          - script: |
              echo "Executing host-level check outside job container"
              docker info --format '{{.ServerVersion}}'
            name: HostCheckStep
            displayName: 'Script (Host Target): Verify Host Docker Engine'
            target: host
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: false
            env:
              HOST_OS: '$(Agent.OS)'

      # ------------------------------------------------------------------------
      # JOB 2: Build Docker Image & Push to ACR
      # ------------------------------------------------------------------------
      - job: DockerBuildAndPushJob
        displayName: 'Build & Push Image to ACR'
        dependsOn: MatrixTestJob
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 30
        workspace:
          clean: all
        variables:
          DOCKER_BUILDKIT: '1'

        steps:
          - checkout: self
            clean: true
            displayName: 'Checkout Source Code'

          # Builds test.Dockerfile and pushes both :<BuildId> and :latest to ACR
          - task: Docker@2
            name: BuildAndPushTask
            displayName: 'Task: Build & Push Image to ACR'
            condition: succeeded()
            enabled: true
            target: host
            timeoutInMinutes: 20
            retryCountOnTaskFailure: 1
            env:
              DOCKER_BUILDKIT: '1'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: '$(imageRepository)'
              Dockerfile: '$(dockerfileName)'
              tags: |
                $(tag)
                latest

  # ============================================================================
  # STAGE 2: OPTIONAL IMAGE AUDIT (Pulls & Inspects Image from ACR)
  # ============================================================================
  - stage: Security_Audit_Stage
    displayName: 'Stage 2: Optional ACR Image Audit'
    dependsOn: CI_Stage
    condition: succeeded()
    trigger: automatic
    isSkippable: true
    lockBehavior: sequential
    variables:
      auditLevel: 'HIGH'
    pool:
      name: default

    jobs:
      - job: ImageInspectJob
        displayName: 'Inspect Image from ACR'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 10
        workspace:
          clean: outputs
        variables:
          FULL_IMAGE: '$(acrLoginServer)/$(imageRepository):$(tag)'

        steps:
          - checkout: none

          - task: Docker@2
            displayName: 'Task: Login to ACR'
            inputs:
              command: 'login'
              containerRegistry: '$(acrServiceConnection)'

          - bash: |
              docker pull $(FULL_IMAGE)
              docker image inspect $(FULL_IMAGE) --format='Size={{.Size}} Created={{.Created}}'
            name: InspectStep
            displayName: 'Bash: Pull & Inspect ACR Image Metadata'
            condition: succeeded()
            enabled: true
            timeoutInMinutes: 5
            continueOnError: true
            env:
              AUDIT_LEVEL: '$(auditLevel)'

          - task: Docker@2
            displayName: 'Task: Logout from ACR'
            condition: always()
            inputs:
              command: 'logout'
              containerRegistry: '$(acrServiceConnection)'

  # ============================================================================
  # STAGE 3: CD (Pull from ACR & Deploy Live Container to Self-Hosted PC)
  # ============================================================================
  - stage: CD_Stage
    displayName: 'Stage 3: Deploy ACR Image to Self-Hosted PC'
    dependsOn:
      - CI_Stage
      - Security_Audit_Stage
    condition: and(succeeded('CI_Stage'), in(dependencies.Security_Audit_Stage.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    trigger: automatic
    isSkippable: false
    lockBehavior: sequential
    variables:
      FULL_IMAGE: '$(acrLoginServer)/$(imageRepository):$(tag)'
    pool:
      name: default

    jobs:
      - deployment: DeployToPC
        displayName: 'Pull from ACR & Run Container'
        dependsOn: []
        condition: succeeded()
        pool:
          name: default
        timeoutInMinutes: 15
        workspace:
          clean: outputs
        variables:
          APP_ENV: 'production'
        environment: 'SelfHosted-PC'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: Docker@2
                  name: ACRLoginTask
                  displayName: 'Task: Login to Azure Container Registry'
                  inputs:
                    command: 'login'
                    containerRegistry: '$(acrServiceConnection)'

                - bash: |
                    set -e
                    echo "Pulling verified image $(FULL_IMAGE) from ACR..."
                    docker pull $(FULL_IMAGE)

                    echo "Stopping and removing existing container (if any)..."
                    docker rm -f $(containerName) 2>/dev/null || true

                    echo "Starting new container $(FULL_IMAGE) on port $(hostPort)..."
                    docker run -d \
                      --name $(containerName) \
                      --restart unless-stopped \
                      -p $(hostPort):$(containerPort) \
                      $(FULL_IMAGE)

                    echo "Waiting for server startup..."
                    sleep 5

                    echo "Verifying container status and HTTP response..."
                    docker ps --filter "name=$(containerName)"
                    docker logs $(containerName)
                    curl -f -I http://localhost:$(hostPort)
                  name: DeployContainerStep
                  displayName: 'Bash: Deploy & Verify Live Container'
                  condition: succeeded()
                  enabled: true
                  timeoutInMinutes: 10
                  continueOnError: false
                  env:
                    NODE_ENV: '$(APP_ENV)'

                - task: Docker@2
                  name: ACRLogoutTask
                  displayName: 'Task: Logout from ACR'
                  condition: always()
                  inputs:
                    command: 'logout'
                    containerRegistry: '$(acrServiceConnection)'